name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android App with Gradle
        working-directory: android
        run: |
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" output/LoveLetters-v1.0.apk
          else
            echo "APK build failed or output not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveLetters-Android-APK
          path: output/LoveLetters-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Love Letters Android App v1.0.0"
          body: |
            ## 📱 Love Letters Android Application (v1.0.0)

            Directly installable APK for Android devices!

            ### Features:
            - Full interactive Love Letters Notebook and dynamic book scene
            - Real-time Instant Messaging with Instagram-style reactions and big emojis
            - Photo, video, sticker, and voice memo recording support
            - Native back navigation and persistent login session

            ### How to Install:
            1. Download `LoveLetters-v1.0.apk` below directly to your Android device.
            2. Tap the downloaded file to install (allow "Install from Unknown Sources" if prompted).
            3. Enjoy your personal Love Letters notebook on your phone!
          files: output/LoveLetters-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
